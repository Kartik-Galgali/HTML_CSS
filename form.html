<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="username">Username:</label>
        <input type="text" id="username" minlength="6" maxlength="15" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" minlength="6" maxlength="15" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="squarepant@gmail.com"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890"><br><br>

        <label for="bday">Birthday:</label>
        <input type="date" id="bday"><br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="0" max="99"><br><br>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="PhD.">PhD.</label>
        <input type="radio" id="PhD." value="PhD." name="title"><br><br>

        <label for="payment">Payment</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="master card">Master Card</option>
            <option value="giftcard">Gift Card</option>
        </select><br><br>

        <label for="subscribe">Subscribe</label>
        <input type="checkbox" id="subscribe"><br><br>

        <label for="comment">Comments:</label>
        <textarea id="comment" rows="3" cols="25"></textarea><br><br>

        <label for="file">Upload File:</label>
        <input type="file" id="file" accept="image/png, image/jpg"><br><br>

        <input type="reset">
        <input type="submit">

    </form>
</body>
</html>
