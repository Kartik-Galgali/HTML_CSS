
<!DOCTYPE html>
<html>
<head>
    <title>Hamburger Without JavaScript</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
        }

        nav {
            background: #222;
            color: white;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        /* Hide checkbox */
        #menu-toggle {
            display: none;
        }

        /* Hamburger icon */
        .hamburger {
            width: 30px;
            height: 25px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger span {
            height: 3px;
            width: 100%;
            background: white;
            border-radius: 5px;
            transition: 0.3s;
        }

        /* Navigation links */
        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        /* Mobile view */
        @media (max-width: 768px) {

            .nav-links {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: #222;
                padding: 20px;
                text-align: center;

                flex-direction: column;
            }

            /* Show menu when checkbox checked */
            #menu-toggle:checked ~ .nav-links {
                display: flex;
            }

            /* First line */
            #menu-toggle:checked + .hamburger span:nth-child(1) {
                transform: translateY(11px) rotate(45deg);
            }

            /* Middle line */
            #menu-toggle:checked + .hamburger span:nth-child(2) {
                opacity: 0;
            }

            /* Last line */
            #menu-toggle:checked + .hamburger span:nth-child(3) {
                transform: translateY(-11px) rotate(-45deg);
            }

            .hamburger {
                display: flex;
            }
        }

        /* Desktop view */
        @media (min-width: 769px) {
            .hamburger {
                display: none;
            }
        }

    </style>
</head>

<body>

    <nav>

        <div class="logo">MyWebsite</div>

        <!-- Checkbox -->
        <input type="checkbox" id="menu-toggle">

        <!-- Hamburger button -->
        <label for="menu-toggle" class="hamburger">

            <span></span>
            <span></span>
            <span></span>

        </label>

        <!-- Navigation links -->
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

</body>
</html>
